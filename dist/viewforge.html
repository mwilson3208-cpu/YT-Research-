<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewforge Research Console</title>
<meta name="description" content="Viewforge reveals the top videos, channels, keywords and trends on YouTube, so you create audio content people are already searching for.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff4d3d'/%3E%3Cpath d='M38 28l34 22-34 22z' fill='white'/%3E%3C/svg%3E">
<style>
/* Viewforge - research console styling */
:root {
  --bg: #0d1117;
  --bg-elevated: #151b24;
  --bg-panel: #11171f;
  --bg-input: #0b1016;
  --border: #232c39;
  --border-strong: #303b4c;
  --text: #e6edf6;
  --text-muted: #8b97a8;
  --text-dim: #66707f;
  --accent: #ff4d3d;
  --accent-soft: rgba(255, 77, 61, 0.12);
  --accent-2: #37c8f0;
  --good: #3fd17c;
  --warn: #f2b53c;
  --bad: #f2564f;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

:root[data-theme="light"] {
  --bg: #f4f6fa;
  --bg-elevated: #ffffff;
  --bg-panel: #ffffff;
  --bg-input: #ffffff;
  --border: #dde3ec;
  --border-strong: #c4cddb;
  --text: #16202d;
  --text-muted: #5b6878;
  --text-dim: #7d8898;
  --accent: #e03a29;
  --accent-soft: rgba(224, 58, 41, 0.1);
  --shadow: 0 8px 24px rgba(16, 32, 45, 0.08);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent-2); text-decoration: none; }
a:hover { text-decoration: underline; }

button { font-family: inherit; }

/* ---------- Layout ---------- */
.app {
  display: grid;
  grid-template-columns: 250px 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas: "brand topbar" "sidebar main";
  height: 100vh;
}

.brand {
  grid-area: brand;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  background: var(--bg-elevated);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.brand-mark {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: linear-gradient(140deg, var(--accent), #ff8a3d);
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 13px;
  flex: none;
}

.brand-name { font-weight: 700; letter-spacing: -0.2px; }
.brand-name span { color: var(--text-muted); font-weight: 500; }

.topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 18px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
}

.topbar-title { font-weight: 600; }
.topbar-sub { color: var(--text-muted); font-size: 12.5px; }
.topbar-spacer { flex: 1; }

.sidebar {
  grid-area: sidebar;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px 10px 40px;
}

.main {
  grid-area: main;
  overflow-y: auto;
  padding: 20px 24px 60px;
  /* Grid items default to min-width:auto, which lets a wide table push the
     whole page sideways. Pin it so the table scrolls inside its own wrapper. */
  min-width: 0;
}

/* ---------- Sidebar nav ---------- */
.nav-group { margin-bottom: 16px; }
.nav-group-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.9px;
  color: var(--text-dim);
  padding: 4px 10px 6px;
  font-weight: 700;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 7px 10px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  text-align: left;
  font-size: 13.2px;
}
.nav-item:hover { background: var(--bg-elevated); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.nav-item.active .nav-icon { background: var(--accent); color: #fff; }

.nav-icon {
  width: 22px; height: 22px;
  border-radius: 5px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
  flex: none;
}

/* ---------- Badges / pills ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 600;
  border: 1px solid var(--border-strong);
  color: var(--text-muted);
  white-space: nowrap;
}
.badge.live { border-color: rgba(63, 209, 124, 0.4); color: var(--good); background: rgba(63, 209, 124, 0.1); }
.badge.demo { border-color: rgba(242, 181, 60, 0.4); color: var(--warn); background: rgba(242, 181, 60, 0.1); }
.badge.good { border-color: rgba(63, 209, 124, 0.4); color: var(--good); background: rgba(63, 209, 124, 0.1); }
.badge.warn { border-color: rgba(242, 181, 60, 0.4); color: var(--warn); background: rgba(242, 181, 60, 0.1); }
.badge.bad { border-color: rgba(242, 86, 79, 0.4); color: var(--bad); background: rgba(242, 86, 79, 0.1); }
.badge.accent { border-color: rgba(255, 77, 61, 0.4); color: var(--accent); background: var(--accent-soft); }

.dot { width: 7px; height: 7px; border-radius: 99px; background: currentColor; }

/* ---------- Panels ---------- */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.panel-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.panel-title { font-weight: 650; font-size: 15px; }
.panel-note { color: var(--text-muted); font-size: 12.5px; }

.tool-header { margin-bottom: 14px; }
.tool-header h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.3px; }
.tool-header p { margin: 0; color: var(--text-muted); max-width: 760px; }

/* ---------- Forms ---------- */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  align-items: end;
}
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.wide { grid-column: span 2; }
.field label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); font-weight: 700; }
.field-hint { font-size: 11.5px; color: var(--text-dim); }

input[type="text"], input[type="number"], select, textarea {
  background: var(--bg-input);
  border: 1px solid var(--border-strong);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  font-size: 13.5px;
  font-family: inherit;
  width: 100%;
}
textarea { min-height: 170px; resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: var(--accent);
  color: #fff;
  font-weight: 650;
  font-size: 13.5px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: var(--border-strong); color: var(--text-muted); }
.btn.ghost:hover { color: var(--text); border-color: var(--accent); }
.btn.sm { padding: 5px 10px; font-size: 12px; }

.checkbox { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
.checkbox input { accent-color: var(--accent); width: 15px; height: 15px; }

/* ---------- Stat tiles ---------- */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}
.stat {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
}
.stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-dim); font-weight: 700; }
.stat-value { font-size: 19px; font-weight: 700; margin-top: 3px; letter-spacing: -0.4px; }
.stat-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

/* ---------- Table ---------- */
.table-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.table-toolbar .grow { flex: 1; }
.table-count { font-size: 12.5px; color: var(--text-muted); }

.table-wrap {
  overflow: auto;
  max-width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-height: 68vh;
  background: var(--bg-panel);
}

table.data { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 13px; }
table.data th, table.data td {
  padding: 8px 11px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
  vertical-align: middle;
}
table.data thead th {
  position: sticky; top: 0; z-index: 3;
  background: var(--bg-elevated);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border-strong);
}
table.data thead th:hover { color: var(--text); }
table.data thead th.sorted { color: var(--accent); }
table.data tbody tr:hover { background: var(--bg-elevated); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data td.title-cell { white-space: normal; min-width: 260px; max-width: 360px; }
table.data td.thumb-cell { width: 92px; }
table.data td.thumb-cell img { width: 76px; height: 43px; object-fit: cover; border-radius: 4px; display: block; background: var(--bg-input); }
.thumb-fallback {
  width: 76px; height: 43px; border-radius: 4px;
  background: linear-gradient(135deg, var(--bg-input), var(--bg-elevated));
  border: 1px solid var(--border);
  display: grid; place-items: center;
  font-size: 9px; color: var(--text-dim); letter-spacing: 0.4px;
}

.score-bar { position: relative; min-width: 62px; }
.score-bar-fill {
  position: absolute; inset: 0;
  border-radius: 3px;
  background: linear-gradient(90deg, rgba(255, 77, 61, 0.45), rgba(255, 138, 61, 0.3));
}
.score-bar span { position: relative; padding-left: 4px; font-variant-numeric: tabular-nums; }

.col-toggle {
  position: relative;
}
.col-menu {
  position: absolute;
  right: 0; top: calc(100% + 6px);
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px;
  width: 280px;
  max-height: 340px;
  overflow-y: auto;
  z-index: 20;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 10px;
}
.col-menu.hidden { display: none; }
.col-menu label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); cursor: pointer; }

/* ---------- Chips / lists ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 12.5px;
  cursor: pointer;
  color: var(--text-muted);
}
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip b { color: var(--text); font-variant-numeric: tabular-nums; }

.list { display: flex; flex-direction: column; gap: 8px; }
.list-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 11px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.list-row .rank { color: var(--text-dim); font-variant-numeric: tabular-nums; font-weight: 700; min-width: 20px; }
.list-row .body { flex: 1; min-width: 0; }
.list-row .meta { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
.list-row.pass { border-left: 3px solid var(--good); }
.list-row.fail { border-left: 3px solid var(--warn); }

.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.three-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }

.output {
  background: var(--bg-input);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 13px 15px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13.5px;
  line-height: 1.65;
  max-height: 480px;
  overflow-y: auto;
}
.output.mono { font-family: var(--mono); font-size: 12.5px; }

.transcript-line { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--border); }
.transcript-line time { color: var(--accent-2); font-family: var(--mono); font-size: 12px; flex: none; }

.meter { height: 6px; border-radius: 99px; background: var(--bg-input); overflow: hidden; border: 1px solid var(--border); }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.good i { background: var(--good); }
.meter.warn i { background: var(--warn); }
.meter.bad i { background: var(--bad); }

/* ---------- Feedback ---------- */
.notice {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-elevated);
  font-size: 13px;
  margin-bottom: 14px;
}
.notice.error { border-color: rgba(242, 86, 79, 0.45); background: rgba(242, 86, 79, 0.08); }
.notice.info { border-color: rgba(55, 200, 240, 0.35); background: rgba(55, 200, 240, 0.07); }
.notice.warn { border-color: rgba(242, 181, 60, 0.4); background: rgba(242, 181, 60, 0.08); }
.notice b { display: block; margin-bottom: 2px; }

.spinner {
  width: 15px; height: 15px;
  border: 2px solid var(--border-strong);
  border-top-color: var(--accent);
  border-radius: 99px;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading { display: flex; align-items: center; gap: 10px; color: var(--text-muted); padding: 22px 0; }

.empty {
  text-align: center;
  padding: 38px 20px;
  color: var(--text-dim);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}
.empty h3 { color: var(--text-muted); margin: 0 0 6px; font-size: 15px; }

.toast {
  position: fixed;
  bottom: 22px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 99px;
  box-shadow: var(--shadow);
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s, transform 0.18s;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.hidden { display: none !important; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px; }
.kv dt { color: var(--text-dim); }
.kv dd { margin: 0; font-weight: 600; }

.pairing {
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  padding: 12px 15px;
  font-size: 13px;
  margin-bottom: 16px;
}
.pairing b { color: var(--text); }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: 56px auto 1fr;
    grid-template-areas: "brand" "topbar" "main";
  }
  .brand { border-right: 0; }
  .sidebar {
    position: fixed;
    top: 56px; bottom: 0; left: 0;
    width: 250px;
    z-index: 50;
    transform: translateX(-100%);
    transition: transform 0.2s;
    box-shadow: var(--shadow);
    display: block;
    grid-area: unset;
  }
  .sidebar.open { transform: translateX(0); }
  .main { padding: 16px; }
  .panel { padding: 13px 14px; }
  .output { font-size: 13px; }
  table.data td.title-cell { min-width: 180px; max-width: 220px; }
  .field.wide { grid-column: span 1; }
  .topbar-sub { display: none; }
}
@media (min-width: 901px) { .menu-btn { display: none; } }

/* ---------- Settings modal (browser build) ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(3, 6, 11, 0.66);
  backdrop-filter: blur(2px);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 200;
  overflow-y: auto;
}

.modal {
  background: var(--bg-panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 20px;
  width: min(620px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }

.howto {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  padding: 10px 13px;
}
.howto summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text-muted); }
.howto summary:hover { color: var(--text); }
.howto-list { margin: 10px 0 2px; padding-left: 20px; color: var(--text-muted); font-size: 13px; line-height: 1.7; }
.howto-list li { margin-bottom: 4px; }

.hero {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--accent-soft), transparent 70%);
  padding: 18px 20px;
  margin-bottom: 16px;
}
.hero h2 { margin: 0 0 6px; font-size: 17px; letter-spacing: -0.2px; }
.hero p { margin: 0 0 12px; color: var(--text-muted); max-width: 640px; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }

</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="brand-mark">VF</div>
    <div class="brand-name">View<span>forge</span></div>
  </div>

  <header class="topbar">
    <button class="btn ghost sm menu-btn" id="menu-btn" aria-label="Toggle menu">Menu</button>
    <div>
      <div class="topbar-title" id="top-title">Keyword Generator</div>
      <div class="topbar-sub" id="top-sub">Loading...</div>
    </div>
    <div class="topbar-spacer"></div>
    <span class="badge" id="quota">-</span>
    <span class="badge" id="mode-badge">Starting...</span>
    <button class="btn ghost sm" id="settings-btn" title="Add your YouTube API key">Settings</button>
    <button class="btn ghost sm" id="cache-btn" title="Clear the 10 minute result cache">Clear cache</button>
    <button class="btn ghost sm" id="theme-btn" title="Switch light / dark">Theme</button>
  </header>

  <nav class="sidebar" id="sidebar">
    <div id="nav"></div>
    <div class="pairing" style="margin:14px 4px 0">
      <b>Research, then record.</b>
      Find the winning topic, title and trend here. Take the script straight into your voiceover tool and publish.
    </div>
  </nav>

  <main class="main" id="main">
    <div class="loading"><span class="spinner"></span><span>Starting Viewforge...</span></div>
  </main>
</div>

<noscript>
  <div style="padding:24px">Viewforge needs JavaScript enabled to run its research tools.</div>
</noscript>

const settings = {

    const q = need(body.input, 'A keyword');
    label = q;
    if (isLive()) {
      const { items } = await yt.searchVideos({ q, maxResults: clamp(body.limit, 5, 50, 25), order: 'relevance' });

  const rows = await withChannelContext(videos, body.region);
  const tagStats = new Map();
  const cooccurrence = new Map();

  for (const row of rows) {
    const tags = row.tags.map((tag) => tag.toLowerCase().trim()).filter(Boolean);
    for (const tag of tags) {
      const entry = tagStats.get(tag) || { tag, videos: 0, totalViews: 0, words: tag.split(/\s+/).length };
      entry.videos += 1;
      entry.totalViews += row.views;

    ...entry,
    averageViews: Math.round(entry.totalViews / entry.videos),
    usageRate: Math.round((entry.videos / rows.length) * 100),
    type: entry.words >= 3 ? 'Long tail' : entry.words === 2 ? 'Mid tail' : 'Broad',

    tagPairs: [...cooccurrence.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20).map(([pair, count]) => ({ pair, count })),

/* ------------------------------------------------------------------ *
 * Tool 8: Keyword Generator
 * ------------------------------------------------------------------ */
async function keywordResearch(body = {}) {
  const seed = need(body.seed, 'A seed keyword');
  const depth = body.depth === 'quick' ? 'quick' : 'standard';

  let result = await expandKeywords(seed, { depth, language: config.language, region: config.region });

  // Autocomplete can be blocked by a firewall; fall back to the offline bank.
  if (!result.keywords.length) {
    const offline = demo.demoSuggest(seed);
    const counts = new Map();
    for (const phrase of offline) counts.set(phrase, 1);
    result = {
      seed,
      variantsProbed: offline.length,
      keywords: [...counts.entries()].map(([keyword, appearances]) => scoreKeyword(keyword, appearances, seed))
        .sort((a, b) => b.score - a.score),
      offline: true,
    };
  }

  const keywords = result.keywords.slice(0, clamp(body.limit, 20, 500, 200));
  return {
    mode: isLive() ? 'live' : 'demo',
    autocompleteSource: result.offline ? 'offline-bank' : 'youtube-autocomplete',
    offlineReason: result.offline ? (config.runtime === 'browser' ? 'browser-cors' : 'network') : null,
    seed,
    variantsProbed: result.variantsProbed,
    total: result.keywords.length,
    keywords,
    buckets: {
      questions: keywords.filter((k) => k.isQuestion).slice(0, 30),
      longTail: keywords.filter((k) => k.words >= 4).slice(0, 30),
      easyWins: keywords.filter((k) => k.difficulty === 'Easy').slice(0, 30),
      headTerms: keywords.filter((k) => k.words <= 2).slice(0, 20),
    },
  };
}

/* ------------------------------------------------------------------ *
 * Tool 9: Outlier / Opportunity Finder
 * ------------------------------------------------------------------ */
async function outlierFinder(body = {}) {
  const q = need(body.q, 'A niche or keyword');
  const maxSubscribers = clamp(body.maxSubscribers, 0, 100000000, 100000);
  const minViews = clamp(body.minViews, 0, 100000000, 10000);
  const result = await videoSearch({ ...body, q, order: 'viewCount', maxResults: clamp(body.maxResults, 10, 50, 50) });

  const candidates = result.rows
    .filter((row) => row.views >= minViews)
    .filter((row) => row.subscribers === null || row.subscribers <= maxSubscribers)
    .sort((a, b) => (b.viewsPerSubscriber || b.outlierScore || 0) - (a.viewsPerSubscriber || a.outlierScore || 0));

  return {
    ...result,
    rows: candidates.length ? candidates : result.rows,
    filters: { maxSubscribers, minViews, matched: candidates.length, scanned: result.rows.length },
    reading: candidates.length
      ? 'Videos where views dwarf subscriber count. The topic carried the video, so the topic is copyable.'
      : 'No videos passed the filters. Loosen the subscriber ceiling or lower the minimum views.',
  };
}

  form.addEventListener('submit', submit);
  // Enter should run the tool from any single-line input.
  for (const [, { input, field }] of controls) {
    if (field.type !== 'textarea') {
      input.addEventListener('keydown', (event) => { if (event.key === 'Enter') submit(event); });
    }
  }

  return form;
}

async function run(tool, body, button) {
  const results = document.getElementById('results');
  button.disabled = true;
  const originalLabel = button.textContent;
  button.textContent = 'Working...';
  clear(results).append(el('div', { class: 'loading' }, [
    el('span', { class: 'spinner' }),
    el('span', { text: loadingMessage(tool) }),
  ]));

  try {
    const payload = await call(tool.endpoint, body);
    state.results.set(tool.id, payload);
    drawResults(tool, payload, results);
    renderStatus();
    loadStatus();
  } catch (error) {
    clear(results).append(errorNotice(error));
  } finally {
    button.disabled = false;
    button.textContent = originalLabel;
  }
}

function loadingMessage(tool) {
  const messages = {
    keywords: 'Probing YouTube autocomplete across A-Z and modifier variants...',
    trends: 'Pulling the most popular chart and scoring velocity...',
    videos: 'Searching, then fetching full statistics and channel context...',
    shorts: 'Finding sub-60-second uploads and reading their hooks...',
    transcript: 'Reading the caption track from the watch page...',
    comments: 'Reading comments and scoring sentiment...',
    channel: 'Loading uploads and working out the publishing pattern...',
    compare: 'Loading each channel in turn...',
  };
  return messages[tool.id] || 'Working...';
}

function errorNotice(error) {
  const hints = {
    demo_mode: 'Open Settings in the header and paste your YouTube API key.',
    quotaExceeded: 'The YouTube quota resets at midnight Pacific. Until then, clear your key in Settings to keep using sample data.',
    keyInvalid: 'That API key was rejected. Check it in the Google Cloud console and confirm YouTube Data API v3 is enabled.',
    accessNotConfigured: 'Enable "YouTube Data API v3" for this project in the Google Cloud console.',
    commentsDisabled: 'Pick a video that allows comments.',
  };
  return notice('error', error.message, hints[error.reason] || '');
}

function drawResults(tool, payload, container) {
  clear(container);
  const context = {
    sendToSpinner(text, title) {
      state.inputs.set('spinner', { text, title, intensity: 'medium', tone: 'conversational', addOpeners: true });
      window.location.hash = '#/spinner';
      toast('Transcript loaded into the Content Spinner');
    },
  };
  try {
    const nodes = tool.render(payload.data, context) || [];
    for (const node of [].concat(nodes)) if (node) container.append(node);
    container.append(el('div', { class: 'panel-note', style: 'margin-top:6px', text: `Completed in ${payload.elapsedMs} ms - ${payload.mode} mode` }));
  } catch (error) {
    console.error(error);
    container.append(notice('error', 'Could not render these results', error.message));
  }
}

      ['YouTube autocomplete', 'The Keyword Generator reads the same suggestion endpoint the YouTube search box uses. Browsers block that endpoint, so this hosted build falls back to a pattern bank and says so on screen.'],

function openSettings() {
  const current = currentSettings();
  const keyInput = el('input', { type: 'text', placeholder: 'AIza...', spellcheck: 'false' });
  keyInput.value = current.apiKey || '';

  const regionInput = el('input', { type: 'text', maxlength: '2' });
  regionInput.value = current.region || 'US';
  const languageInput = el('input', { type: 'text', maxlength: '5' });
  languageInput.value = current.language || 'en';
  const rpmLowInput = el('input', { type: 'number', step: '0.05', min: '0' });
  rpmLowInput.value = String(current.rpmLow);
  const rpmHighInput = el('input', { type: 'number', step: '0.05', min: '0' });
  rpmHighInput.value = String(current.rpmHigh);

  const status = el('div', { class: 'field-hint' });

  const close = () => overlay.remove();

  const save = () => {
    const stored = saveApiKey(keyInput.value);
    savePrefs({
      region: (regionInput.value || 'US').toUpperCase().slice(0, 2),
      language: (languageInput.value || 'en').trim(),
      rpmLow: Number(rpmLowInput.value) || 0.5,
      rpmHigh: Number(rpmHighInput.value) || 6,
    });
    if (!stored && keyInput.value.trim()) {
      status.textContent = 'Saved for this session. Your browser blocked local storage, so you will need to paste it again after a reload.';
      toast('Key active for this session');
    } else {
      toast(keyInput.value.trim() ? 'API key saved in this browser' : 'Key cleared - back to sample data');
      close();
    }
    state.results.clear();
    loadStatus().then(route);
  };

  const dialog = el('div', { class: 'modal', onclick: (event) => event.stopPropagation() }, [
    el('div', { class: 'modal-head' }, [
      el('div', { class: 'panel-title', text: 'Settings' }),
      el('button', { class: 'btn ghost sm', onclick: close }, 'Close'),
    ]),
    notice('info', 'Your key stays in this browser',
      'It is saved in this browser only and sent straight to Google when you run a search. It never reaches any other server, and nobody else who opens this page can see it.'),
    el('div', { class: 'field' }, [
      el('label', { text: 'YouTube Data API v3 key' }),
      keyInput,
      el('span', { class: 'field-hint', text: 'Leave this empty to keep working with the bundled sample library.' }),
    ]),
    el('details', { class: 'howto' }, [
      el('summary', { text: 'How to get a free key (about 3 minutes)' }),
      el('ol', { class: 'howto-list' }, [
        el('li', {}, [ 'Open the ', el('a', { href: 'https://console.cloud.google.com/projectcreate', target: '_blank', rel: 'noopener' }, 'Google Cloud console'), ' and create a project.' ]),
        el('li', {}, [ 'Open ', el('a', { href: 'https://console.cloud.google.com/apis/library/youtube.googleapis.com', target: '_blank', rel: 'noopener' }, 'YouTube Data API v3'), ' and press Enable.' ]),
        el('li', {}, [ 'Go to ', el('a', { href: 'https://console.cloud.google.com/apis/credentials', target: '_blank', rel: 'noopener' }, 'Credentials'), ', choose Create credentials, then API key.' ]),
        el('li', { text: 'Copy the key and paste it above. Google gives you 10,000 free units a day.' }),
        el('li', { text: 'Optional: restrict the key to this page under Website restrictions, so nobody else can spend your quota.' }),
      ]),
    ]),
    el('div', { class: 'form-grid' }, [
      el('div', { class: 'field' }, [el('label', { text: 'Default region' }), regionInput]),
      el('div', { class: 'field' }, [el('label', { text: 'Language' }), languageInput]),
      el('div', { class: 'field' }, [el('label', { text: 'RPM low (USD)' }), rpmLowInput]),
      el('div', { class: 'field' }, [el('label', { text: 'RPM high (USD)' }), rpmHighInput]),
    ]),
    el('div', { class: 'field-hint', text: 'RPM sets the earnings estimate band, in dollars per 1,000 monetized views.' }),
    status,
    el('div', { class: 'modal-actions' }, [
      el('button', { class: 'btn ghost', onclick: () => { keyInput.value = ''; save(); } }, 'Clear key'),
      el('button', { class: 'btn', onclick: save }, 'Save'),
    ]),
  ]);

  const overlay = el('div', { class: 'overlay', onclick: close }, [dialog]);
  document.body.append(overlay);
  keyInput.focus();
  document.addEventListener('keydown', function escape(event) {
    if (event.key === 'Escape') { close(); document.removeEventListener('keydown', escape); }
  });
}
